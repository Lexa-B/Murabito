[package]
name = "viewer"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
hexworld = { path = "../hexworld" }
hexworld_bevy = { path = "../hexworld_bevy" }
bevy = { version = "0.19", default-features = false, features = [
  "bevy_winit", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_pbr",
  "bevy_asset", "bevy_log", "bevy_ui", "bevy_ui_render", "bevy_text",
  "x11", "multi_threaded", "tonemapping_luts", "zstd_rust", "png", "default_font", "std",
  "keyboard", "mouse",
] }
# `manage_clipboard` (a default feature) pulls in `smithay-clipboard` unconditionally on
# Linux, which needs Wayland client dev headers this machine does not have (see the
# workspace notes on X11-only, no-Wayland features). `render` is what actually draws the
# panel; `default_fonts` is needed or egui has no glyphs to draw text with.
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts"] }
