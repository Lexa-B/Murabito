[project]
name = "midbrain"
version = "0.1.0"
description = "The slow mind of Murabito, outside the game: reads the board, sends orders"
readme = "README.md"
authors = [
    { name = "Lexa", email = "Lexa.40@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.36.2",
    "rich>=15.0.0",
]

[project.scripts]
board = "midbrain.board:main"
order = "midbrain.order:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
]
