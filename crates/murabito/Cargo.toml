[package]
name = "murabito"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The debug build: `cargo run -p murabito --features debug`. Turns on each module's
# debug feature (its types on the wire) and the server that serves them. Off by default.
debug = [
    "murabito_debug/debug",
    "murabito_placement/debug",
    "murabito_identity/debug",
    "murabito_kinds/debug",
    "murabito_perception/debug",
    "murabito_vision/debug",
]

[dependencies]
bevy.workspace = true
murabito_scene.workspace = true
murabito_camera.workspace = true
murabito_debug.workspace = true
murabito_movement.workspace = true
murabito_placement.workspace = true
murabito_perception.workspace = true
murabito_vision.workspace = true
murabito_progress.workspace = true
murabito_actions.workspace = true
murabito_brainstem.workspace = true
murabito_user_data.workspace = true
murabito_settings.workspace = true
murabito_i18n.workspace = true
murabito_identity.workspace = true
murabito_kinds.workspace = true
murabito_app_state.workspace = true
murabito_ui.workspace = true
murabito_navigation.workspace = true
murabito_menu.workspace = true
murabito_settings_page.workspace = true
