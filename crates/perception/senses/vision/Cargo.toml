[package]
name = "murabito_vision"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The debug build: this crate's types derive `Reflect` and the plugin registers them, so
# a debug client can read them by type path. Off by default; the app's `debug` feature
# turns it on.
debug = ["murabito_hexcoords/debug", "murabito_identity/debug"]

[dependencies]
bevy.workspace = true
murabito_hexcoords.workspace = true
murabito_identity.workspace = true
murabito_placement.workspace = true
murabito_perception.workspace = true

[dev-dependencies]
murabito_movement.workspace = true
murabito_progress.workspace = true
serde_json.workspace = true
