[package]
name = "murabito_kinds"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The debug build: every node of the tree and `Model` derive `Reflect` and the plugin
# registers them, so a thing's components say what it is. Off by default; the app's
# `debug` feature turns it on.
debug = []

[dependencies]
bevy.workspace = true
murabito_actions.workspace = true
murabito_hexcoords.workspace = true
murabito_identity.workspace = true
murabito_movement.workspace = true
murabito_placement.workspace = true
murabito_vision.workspace = true

[dev-dependencies]
murabito_progress.workspace = true
