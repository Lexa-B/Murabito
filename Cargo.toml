[workspace]
resolver = "3"
# Listed rather than globbed: a glob must match only crates, and `crates/action/` is a
# group of them, not one. `cargo new` adds a new top-level path here itself; a new
# mechanism under `crates/action/mechanisms/` needs nothing.
members = [
    "crates/murabito",
    "crates/debug",
    "crates/scene",
    "crates/camera",
    "crates/keybinds",
    "crates/hexcoords",
    "crates/placement",
    "crates/all_things/identity",
    "crates/action/progress",
    "crates/action/mechanisms/*",
    "crates/action/actions",
    "crates/user_data",
    "crates/settings",
    "crates/i18n",
    "crates/app_state",
    "crates/ui/kit",
    "crates/ui/navigation",
    "crates/ui/menu",
    "crates/ui/settings_page",
    "crates/all_things/kinds",
    "crates/perception/perception",
    "crates/perception/senses/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# `serialize` so that KeyCode and MouseButton can be written to the settings file.
bevy = { version = "0.19.1", features = ["serialize"] }
murabito_scene = { path = "crates/scene" }
murabito_camera = { path = "crates/camera" }
murabito_keybinds = { path = "crates/keybinds" }
murabito_hexcoords = { path = "crates/hexcoords" }
murabito_placement = { path = "crates/placement" }
murabito_identity = { path = "crates/all_things/identity" }
murabito_debug = { path = "crates/debug" }
murabito_progress = { path = "crates/action/progress" }
murabito_movement = { path = "crates/action/mechanisms/movement" }
murabito_actions = { path = "crates/action/actions" }
murabito_kinds = { path = "crates/all_things/kinds" }
murabito_perception = { path = "crates/perception/perception" }
murabito_vision = { path = "crates/perception/senses/vision" }
murabito_user_data = { path = "crates/user_data" }
murabito_settings = { path = "crates/settings" }
murabito_i18n = { path = "crates/i18n" }
murabito_app_state = { path = "crates/app_state" }
murabito_ui = { path = "crates/ui/kit" }
murabito_navigation = { path = "crates/ui/navigation" }
murabito_menu = { path = "crates/ui/menu" }
murabito_settings_page = { path = "crates/ui/settings_page" }

# Where the player's files go: the platform's config directory.
dirs = "7"
serde = { version = "1", features = ["derive"] }
# Only for tests that pin what a type looks like on the debug wire.
serde_json = "1"
# YAML for everything hand-written. serde_yaml is unmaintained; this is the fork in use.
serde_yaml_ng = "0.10"
# Only for naming a backup after the moment it was taken.
time = { version = "0.3", features = ["formatting", "macros"] }
tempfile = "3"

# Bevy is slow in a plain debug build. Our own code is lightly optimised and
# every dependency (the engine) fully: the engine is rebuilt rarely, our code often.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
